spring:
  application:
    name: cryptarena-be
  
  datasource:
    url: jdbc:postgresql://localhost:5432/cryptarena_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    # Set to true after first successful run if you want strict validation
    
server:
  port: 8080

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production-minimum-32-chars}
  access-token-expiration: 900000    # 15 minutes in milliseconds
  refresh-token-expiration: 604800000 # 7 days in milliseconds

# Twitter OAuth 2.0 Configuration
twitter:
  oauth2:
    client-id: ${TWITTER_CLIENT_ID:your-twitter-client-id}
    client-secret: ${TWITTER_CLIENT_SECRET:your-twitter-client-secret}
    redirect-uri: ${TWITTER_REDIRECT_URI:http://localhost:3000/auth/callback}

# Privy Configuration
privy:
  app-id: ${PRIVY_APP_ID:your-privy-app-id}
  app-secret: ${PRIVY_APP_SECRET:your-privy-app-secret}
  verification-key: ${PRIVY_VERIFICATION_KEY:}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# CoinMarketCap API Configuration
coinmarketcap:
  api-key: ${CMC_API_KEY:your-coinmarketcap-api-key}
  base-url: https://pro-api.coinmarketcap.com/v1

# Indexer Service API Key (for internal endpoints)
indexer:
  api-key: ${INDEXER_API_KEY:change-this-indexer-secret-key}

# Admin API Key (for admin endpoints)
admin:
  api-key: ${ADMIN_API_KEY:change-this-admin-secret-key}

# Solana Airdrop Configuration
solana:
  rpc:
    url: ${SOLANA_RPC_URL:https://api.devnet.solana.com}
  airdrop:
    private-key: ${SOLANA_AIRDROP_PRIVATE_KEY:your-base58-private-key-here}
    amount: ${SOLANA_AIRDROP_AMOUNT:0.05}
    cooldown-hours: ${SOLANA_AIRDROP_COOLDOWN_HOURS:8}
    use-faucet-fallback: ${SOLANA_USE_FAUCET_FALLBACK:true}

