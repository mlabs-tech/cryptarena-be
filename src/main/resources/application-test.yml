spring:
  application:
    name: cryptarena-be-test
  
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    
server:
  port: ${PORT:8080}

# Logging - Moderate verbosity for test
logging:
  level:
    root: INFO
    com.cryptarena.backend: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# CORS Configuration (comma-separated for multiple origins)
# Set via env: CORS_ALLOWED_ORIGINS=https://cryptarena.fun,https://www.cryptarena.fun
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://cryptarena.fun,https://www.cryptarena.fun}

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

